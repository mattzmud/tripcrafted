<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip — TripCrafted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F6F0;
    --card: #FFFFFF;
    --primary: #4CAF50;
    --secondary: #7C3AED;
    --text: #1A1A2E;
    --muted: #6B7280;
    --border: #E5E0D8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Nunito Sans', sans-serif;
    padding-bottom: 60px;
  }
  h1, h2, h3, label, .heading { font-family: 'Nunito', sans-serif; font-weight: 800; }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .logo { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 20px; color: var(--primary); text-decoration: none; }
  header nav a { margin-left: 16px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
  .trip-header-card {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border-radius: 20px;
    padding: 24px 22px;
    margin-bottom: 24px;
  }
  .trip-header-card h2 { margin: 0 0 4px 0; font-size: 26px; color: white; }
  .trip-header-card .dates { color: rgba(255,255,255,0.85); font-size: 14px; }
  .trip-attendees { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .attendee-chip {
    background: rgba(255,255,255,0.2); color: white; font-size: 13px;
    padding: 4px 12px; border-radius: 16px; font-weight: 600;
  }
  .trip-lodging { margin-top: 12px; }
  .trip-lodging a {
    color: white; font-size: 14px; font-weight: 700; text-decoration: none;
    background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 8px; display: inline-block;
  }
  .trip-lodging a:hover { background: rgba(255,255,255,0.3); }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; padding: 10px 4px; margin-right: 16px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px;
    color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--primary); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 15px;
    margin-top: 6px;
    margin-bottom: 14px;
    background: var(--bg);
    color: var(--text);
  }
  textarea { min-height: 60px; resize: vertical; }
  label { font-size: 13px; color: var(--muted); display: block; text-transform: uppercase; letter-spacing: 0.03em; }
  button {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-secondary { background: var(--card); color: var(--secondary); border: 1.5px solid var(--secondary); }
  .btn-text { background: transparent; color: var(--muted); padding: 6px 8px; }
  .btn-danger { background: transparent; color: #C0392B; padding: 4px 8px; font-size: 13px; }
  .btn-link { background: transparent; color: var(--secondary); padding: 4px 8px; font-size: 13px; }
  .row { display: flex; gap: 10px; }
  .card-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .day-group { margin-bottom: 20px; }
  .day-label { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: var(--secondary); margin-bottom: 8px; }
  .meal-card { display: flex; justify-content: space-between; align-items: flex-start; }
  .meal-slot { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; }
  .meal-name { font-weight: 700; font-size: 16px; margin: 2px 0; }
  .meal-meta { font-size: 13px; color: var(--muted); }
  .ingredient-list { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 14px; }
  .ingredient-row-display { display: flex; justify-content: space-between; padding: 3px 0; }
  .tag-chip { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 1px 8px; font-size: 12px; margin-left: 4px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .checkbox-row input[type=checkbox] { width: auto; margin: 0; }
  .checkbox-row label { text-transform: none; font-size: 14px; color: var(--text); margin: 0; flex: 1; }
  .qty-input { width: 80px !important; margin: 0 !important; padding: 6px 8px !important; display: none; }
  .ingredient-row {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--bg);
  }
  .ingredient-row-top { display: flex; gap: 8px; }
  .ingredient-row-top input, .ingredient-row-top select { margin-bottom: 8px; }
  .remove-row-btn { background: none; border: none; color: #C0392B; cursor: pointer; font-size: 18px; padding: 4px 8px; }
  .base-qty-wrap { max-width: 140px; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(26,26,46,0.4);
    z-index: 100; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 24px 24px 0 0; padding: 24px 20px 32px;
    width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  }
  @media (min-width: 768px) {
    .modal-overlay { align-items: center; }
    .modal { border-radius: 24px; margin: 20px; }
  }
  .empty-state { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 14px; }
  .category-group { margin-bottom: 18px; }
  .category-label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .shop-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .shop-item:last-child { border-bottom: none; }
  .shop-item input[type=checkbox] { width: 20px; height: 20px; margin: 0; }
  .shop-item.purchased .shop-item-name { text-decoration: line-through; color: var(--muted); }
  .shop-item-name { flex: 1; font-size: 15px; }
  .shop-item-qty { font-size: 13px; color: var(--muted); }
  .radio-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .radio-toggle label {
    flex: 1; text-align: center; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px;
    cursor: pointer; text-transform: none; font-size: 14px; color: var(--text); font-weight: 600;
  }
  .radio-toggle input { display: none; }
  .radio-toggle input:checked + label { border-color: var(--primary); background: var(--bg); color: var(--primary); }
  .error-text { color: #C0392B; font-size: 13px; margin-top: -8px; margin-bottom: 12px; }
  .hidden { display: none !important; }
  a.directions-link { color: var(--secondary); font-size: 13px; text-decoration: none; font-weight: 600; }
  .person-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .person-pill {
    background: var(--card); border: 1.5px solid var(--border); border-radius: 20px;
    padding: 7px 16px; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--muted);
  }
  .person-pill.active { background: var(--primary); border-color: var(--primary); color: white; }
  .packed .shop-item-name, .pack-item.packed .shop-item-name { text-decoration: line-through; color: var(--muted); }
  .auto-tag { font-size: 11px; color: var(--muted); font-style: italic; margin-left: 6px; }
  .theme-swatches { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .swatch {
    width: 64px; padding: 8px 4px; border-radius: 10px; border: 2px solid transparent;
    cursor: pointer; text-align: center; font-size: 11px; font-weight: 700;
  }
  .swatch.selected { border-color: var(--text); }
  .swatch-color { height: 24px; border-radius: 6px; margin-bottom: 4px; }
  .edit-trip-btn {
    background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 8px;
    padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 14px;
  }
  .edit-trip-btn:hover { background: rgba(255,255,255,0.3); }
  .guest-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px; font-size: 13px; margin: 4px 4px 0 0;
  }
  .guest-chip button { padding: 0; background: none; color: var(--muted); font-size: 14px; line-height: 1; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">🧭 TripCrafted</a>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="household.html">Household</a>
    <a href="#" onclick="window.doLogout(); return false;">Log out</a>
  </nav>
</header>

<main>
  <div class="trip-header-card">
    <h2 id="tripName">Loading...</h2>
    <div class="dates" id="tripDates"></div>
    <div class="dates" id="tripDestination" style="margin-top:2px;"></div>
    <div class="trip-attendees" id="tripAttendees"></div>
    <div class="trip-lodging" id="tripLodging"></div>
    <button class="edit-trip-btn hidden" id="editTripBtn" onclick="window.openEditTripModal()">Edit Trip</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="meals" onclick="window.switchTab('meals')">Meals</button>
    <button class="tab-btn" data-tab="supplies" onclick="window.switchTab('supplies')">Supplies</button>
    <button class="tab-btn" data-tab="packing" onclick="window.switchTab('packing')">Packing</button>
    <button class="tab-btn" data-tab="shopping" onclick="window.switchTab('shopping')">Shopping List</button>
  </div>

  <!-- MEALS -->
  <div class="tab-panel active" id="tab-meals">
    <div class="section-header">
      <h3 style="margin:0;">Meals</h3>
      <button class="btn-primary" onclick="window.openMealModal()">+ Add Meal</button>
    </div>
    <div id="mealsList"></div>
    <div id="mealsEmpty" class="empty-state hidden">No meals planned yet.</div>
  </div>

  <!-- SUPPLIES -->
  <div class="tab-panel" id="tab-supplies">
    <div class="section-header">
      <h3 style="margin:0;">Supplies</h3>
      <button class="btn-primary" onclick="window.openSupplyModal()">+ Add Supply</button>
    </div>
    <div id="suppliesList"></div>
    <div id="suppliesEmpty" class="empty-state hidden">No supplies added yet.</div>
  </div>

  <!-- SHOPPING LIST -->
  <div class="tab-panel" id="tab-shopping">
    <div class="section-header">
      <h3 style="margin:0;">Your Shopping List</h3>
    </div>
    <div class="card">
      <div id="shoppingList"></div>
      <div id="shoppingEmpty" class="empty-state hidden">Nothing on your list right now.</div>
    </div>
  </div>

  <!-- PACKING -->
  <div class="tab-panel" id="tab-packing">
    <div class="person-tabs" id="packingPersonTabs"></div>
    <div class="section-header">
      <h3 style="margin:0;" id="packingListTitle">Packing List</h3>
      <button class="btn-primary" onclick="window.openPackingModal()">+ Add Item</button>
    </div>
    <div class="card">
      <div id="packingList"></div>
      <div id="packingEmpty" class="empty-state hidden">Nothing on this list yet.</div>
    </div>
  </div>
</main>

<!-- ADD/EDIT MEAL MODAL -->
<div class="modal-overlay" id="mealModalOverlay">
  <div class="modal">
    <h2 id="mealModalTitle">Add Meal</h2>

    <div class="row">
      <div style="flex:1;">
        <label>Day</label>
        <select id="mealDay"></select>
      </div>
      <div style="flex:1;">
        <label>Meal</label>
        <select id="mealSlot">
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
          <option value="snack">Snack</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>

    <div class="radio-toggle">
      <input type="radio" name="locType" id="locHome" value="home" checked onchange="window.toggleMealLocation()">
      <label for="locHome">Cooking at Home</label>
      <input type="radio" name="locType" id="locOut" value="out" onchange="window.toggleMealLocation()">
      <label for="locOut">Eating Out</label>
    </div>

    <!-- HOME fields -->
    <div id="mealHomeFields">
      <label>Entree Name</label>
      <input type="text" id="mealEntreeName" placeholder="Spaghetti & Meatballs">

      <label>Who's Cooking</label>
      <div id="mealCooksPicker"></div>

      <label style="margin-top:14px;">Ingredients</label>
      <div id="ingredientRowsContainer"></div>
      <button class="btn-secondary" type="button" onclick="window.addIngredientRow()">+ Add Ingredient</button>
    </div>

    <!-- OUT fields -->
    <div id="mealOutFields" class="hidden">
      <label>Restaurant Name</label>
      <input type="text" id="mealRestaurantName" placeholder="The Rusty Anchor">
      <label>Address</label>
      <input type="text" id="mealAddress" placeholder="123 Main St, City, State">
      <label>Notes</label>
      <textarea id="mealOutNotes" placeholder="Reservation at 6:30pm..."></textarea>
    </div>

    <div id="mealError" class="error-text hidden"></div>

    <div class="row" style="margin-top:20px;">
      <button class="btn-text" onclick="window.closeMealModal()">Cancel</button>
      <button class="btn-primary" id="mealSaveBtn" style="flex:1;" onclick="window.saveMeal()">Save Meal</button>
    </div>
  </div>
</div>

<!-- ADD/EDIT SUPPLY MODAL -->
<div class="modal-overlay" id="supplyModalOverlay">
  <div class="modal">
    <h2 id="supplyModalTitle">Add Supply</h2>
    <label>Item Name</label>
    <input type="text" id="supplyName" placeholder="Toilet Paper">

    <label>Category</label>
    <select id="supplyCategory">
      <option value="Food">Food</option>
      <option value="Toiletries">Toiletries</option>
      <option value="Medications">Medications</option>
      <option value="Electronics">Electronics</option>
      <option value="Clothing">Clothing</option>
      <option value="Documents">Documents</option>
      <option value="Other" selected>Other</option>
    </select>

    <div class="base-qty-wrap" id="supplyBaseQtyWrap">
      <label>Quantity</label>
      <input type="number" step="0.1" id="supplyBaseQty" value="1">
    </div>

    <label>Who's Bringing It (optional)</label>
    <div id="supplyBringerPicker"></div>

    <div class="checkbox-row">
      <input type="checkbox" id="supplyNeedsPurchase">
      <label for="supplyNeedsPurchase">Needs to be purchased</label>
    </div>

    <label style="margin-top:10px;">Notes</label>
    <textarea id="supplyNotes" placeholder="Optional notes..."></textarea>

    <div id="supplyError" class="error-text hidden"></div>

    <div class="row" style="margin-top:20px;">
      <button class="btn-text" onclick="window.closeSupplyModal()">Cancel</button>
      <button class="btn-primary" id="supplySaveBtn" style="flex:1;" onclick="window.saveSupply()">Save Supply</button>
    </div>
  </div>
</div>

<!-- ADD/EDIT PACKING ITEM MODAL -->
<div class="modal-overlay" id="packingModalOverlay">
  <div class="modal">
    <h2 id="packingModalTitle">Add Packing Item</h2>
    <label>Item Name</label>
    <input type="text" id="packingName" placeholder="Sunscreen">

    <label>Category</label>
    <select id="packingCategory">
      <option value="Food">Food</option>
      <option value="Toiletries">Toiletries</option>
      <option value="Medications">Medications</option>
      <option value="Electronics">Electronics</option>
      <option value="Clothing">Clothing</option>
      <option value="Documents">Documents</option>
      <option value="Other" selected>Other</option>
    </select>

    <label>Quantity</label>
    <input type="number" step="0.1" id="packingQty" value="1">

    <label>Assign To</label>
    <select id="packingAssignTo"></select>

    <label style="margin-top:10px;">Notes</label>
    <textarea id="packingNotes" placeholder="Optional notes..."></textarea>

    <div id="packingError" class="error-text hidden"></div>

    <div class="row" style="margin-top:20px;">
      <button class="btn-text" onclick="window.closePackingModal()">Cancel</button>
      <button class="btn-primary" id="packingSaveBtn" style="flex:1;" onclick="window.savePacking()">Save Item</button>
    </div>
  </div>
</div>

<!-- EDIT TRIP MODAL -->
<div class="modal-overlay" id="editTripModalOverlay">
  <div class="modal">
    <h2>Edit Trip</h2>
    <label>Trip Name</label>
    <input type="text" id="editTripName">

    <label>Destination / City</label>
    <input type="text" id="editTripDestination">

    <div class="row">
      <div style="flex:1;">
        <label>Start Date</label>
        <input type="date" id="editTripStart">
      </div>
      <div style="flex:1;">
        <label>End Date</label>
        <input type="date" id="editTripEnd">
      </div>
    </div>

    <label>Theme</label>
    <div class="theme-swatches" id="editThemeSwatches"></div>

    <label>Lodging Link</label>
    <input type="text" id="editTripLodging">

    <label>Notes</label>
    <textarea id="editTripNotes"></textarea>

    <label>Attendees</label>
    <div id="editAttendeeChips"></div>

    <label style="margin-top:10px;">Add From Your Household</label>
    <div id="editHouseholdPicker"></div>

    <label style="margin-top:10px;">Invite Someone Else</label>
    <div class="row">
      <input type="text" id="editGuestName" placeholder="Name" style="margin-bottom:0;">
      <input type="email" id="editGuestEmail" placeholder="Email" style="margin-bottom:0;">
      <button class="btn-secondary" onclick="window.addEditGuest()" style="white-space:nowrap;">Add</button>
    </div>
    <div id="editGuestChips" style="margin-top:8px;"></div>

    <div id="editTripError" class="error-text hidden" style="margin-top:14px;"></div>

    <div class="row" style="margin-top:20px;">
      <button class="btn-text" onclick="window.closeEditTripModal()">Cancel</button>
      <button class="btn-primary" style="flex:1;" onclick="window.saveEditTrip()">Save Changes</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc,
    query, where, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { VERSION } from './version.js';
  const { firebaseConfig, TRIP_THEMES, WORKER_URL } = await import(`./firebase-config.js?v=${VERSION}`);

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const CATEGORIES = ['Food', 'Toiletries', 'Medications', 'Electronics', 'Clothing', 'Documents', 'Other'];

  const params = new URLSearchParams(window.location.search);
  const tripId = params.get('trip');

  let currentUser = null;
  let currentPerson = null;
  let trip = null;
  let attendees = [];       // [{id, name, ...}]
  let attendeesById = {};
  let meals = [];
  let items = [];           // all items (meal-ingredient + supply + packing) for this trip
  let editingMealId = null;
  let editingSupplyId = null;
  let currentHousehold = null;
  let myHouseholdAttendees = [];  // attendees on this trip who are in your household
  let householdRoster = [];       // ALL members of your household (not just those on this trip)
  let activePackingTarget = null; // {type:'person', id} or {type:'household', id}
  let editingPackingId = null;
  let editAttendeeIds = [];       // working copy while the Edit Trip modal is open
  let editAttendeeUids = {};      // personId -> authUid, for building attendeeUids on save
  let editPendingGuests = [];     // newly invited trip-only guests, not yet saved
  let selectedEditTheme = 'default';

  if (!tripId) {
    window.location.href = 'index.html';
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    currentUser = user;

    const personQ = query(collection(db, 'people'), where('authUid', '==', user.uid));
    const personSnap = await getDocs(personQ);
    if (personSnap.empty) { window.location.href = 'index.html'; return; }
    currentPerson = { id: personSnap.docs[0].id, ...personSnap.docs[0].data() };

    const tripSnap = await getDoc(doc(db, 'trips', tripId));
    if (!tripSnap.exists()) {
      document.getElementById('tripName').textContent = 'Trip not found';
      return;
    }
    trip = { id: tripSnap.id, ...tripSnap.data() };

    if (!trip.attendeeUids || !trip.attendeeUids.includes(user.uid)) {
      document.getElementById('tripName').textContent = "You don't have access to this trip";
      return;
    }

    applyTheme(trip.theme);
    document.getElementById('tripName').textContent = trip.name;
    document.getElementById('tripDates').textContent = formatDateRange(trip.startDate, trip.endDate);

    const attendeeSnaps = await Promise.all(trip.attendees.map(pid => getDoc(doc(db, 'people', pid))));
    attendees = attendeeSnaps.filter(s => s.exists()).map(s => ({ id: s.id, ...s.data() }));
    attendeesById = {};
    attendees.forEach(a => attendeesById[a.id] = a);

    if (currentPerson.householdId) {
      const hhSnap = await getDoc(doc(db, 'households', currentPerson.householdId));
      if (hhSnap.exists()) {
        currentHousehold = { id: hhSnap.id, ...hhSnap.data() };
        myHouseholdAttendees = attendees.filter(a => currentHousehold.memberIds.includes(a.id));

    if (myHouseholdAttendees.length === 0) myHouseholdAttendees = [currentPerson];

  function formatDateRange(start, end) {
    const opts = { month: 'short', day: 'numeric', year: 'numeric' };
    const s = new Date(start + 'T00:00:00').toLocaleDateString('en-US', opts);
    const e = new Date(end + 'T00:00:00').toLocaleDateString('en-US', opts);
    return `${s} – ${e}`;
  }

  function dateRange(start, end) {
    const dates = [];
    let cur = new Date(start + 'T00:00:00');
    const last = new Date(end + 'T00:00:00');
    while (cur <= last) {
      dates.push(cur.toISOString().slice(0, 10));
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  }

  function formatDayLabel(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }

    const div = document.createElement('div');

  // ============================================================
  // Shared people-picker + quantity logic (used by both meal
  // ingredient rows and the supply form)
  // ============================================================

  // Builds a row per attendee with a checkbox + a per-person qty
  // input (hidden until 2+ people are checked). prefill lets us
  // reopen this in "edit" mode with existing tags/quantities.
  function buildPeoplePickerHtml(prefix, checkedIds, qtyValues) {
    checkedIds = checkedIds || [];
    qtyValues = qtyValues || {};
    return attendees.map(function (p) {
      const isChecked = checkedIds.includes(p.id);
      const qtyVal = qtyValues[p.id] != null ? qtyValues[p.id] : 1;
      return `
        <div class="checkbox-row">
          <input type="checkbox" class="${prefix}-person-cb" data-person-id="${p.id}"
                 ${isChecked ? 'checked' : ''} onchange="window.recalcQtyMode(this)">
          <label style="flex:0 0 auto; min-width:120px;">${escapeHtml(p.name)}</label>
          <input type="number" step="0.1" class="qty-input ${prefix}-person-qty" data-person-id="${p.id}" value="${qtyVal}">
        </div>
      `;
    }).join('');
  }

  // Recalculates whether we're in "single quantity" mode (0-1 people
  // tagged, use the base quantity field) or "split" mode (2+ people
  // tagged, show a quantity field per tagged person). Call this
  // whenever a person checkbox changes.
  window.recalcQtyMode = function (checkboxEl) {
    const scope = checkboxEl.closest('.ingredient-row') || document;
    const prefix = checkboxEl.classList.contains('ing-person-cb') ? 'ing' : 'supply';
    const checked = scope.querySelectorAll(`.${prefix}-person-cb:checked`);
    const baseQtyWrap = scope.querySelector('.base-qty-wrap') || document.getElementById('supplyBaseQtyWrap');

    scope.querySelectorAll(`.${prefix}-person-qty`).forEach(function (inp) { inp.style.display = 'none'; });

    if (checked.length >= 2) {
      if (baseQtyWrap) baseQtyWrap.classList.add('hidden');
      checked.forEach(function (cb) {
        const qtyInput = scope.querySelector(`.${prefix}-person-qty[data-person-id="${cb.dataset.personId}"]`);
        if (qtyInput) qtyInput.style.display = 'inline-block';
      });
    } else {
      if (baseQtyWrap) baseQtyWrap.classList.remove('hidden');
    }
  };

  // Reads the current state of a people-picker + base qty field back
  // into { taggedPeople, quantity }. quantity is a plain number if
  // 0-1 people are tagged, or a {personId: qty} map if 2+.
  function readQtyAndTags(scope, prefix, baseQtyEl) {
    const checked = Array.from(scope.querySelectorAll(`.${prefix}-person-cb:checked`));
    const taggedPeople = checked.map(function (cb) { return cb.dataset.personId; });
    let quantity;
    if (taggedPeople.length >= 2) {
      quantity = {};
      taggedPeople.forEach(function (pid) {
        const qtyInput = scope.querySelector(`.${prefix}-person-qty[data-person-id="${pid}"]`);
        quantity[pid] = parseFloat(qtyInput.value) || 1;
      });
    } else {
      quantity = parseFloat(baseQtyEl.value) || 1;
    }
    return { taggedPeople: taggedPeople, quantity: quantity };
  }

  // ---------- Meals ----------
  function populateMealDayOptions() {
    const sel = document.getElementById('mealDay');
    sel.innerHTML = '';
    dateRange(trip.startDate, trip.endDate).forEach(function (d) {
      const opt = document.createElement('option');

      sel.appendChild(opt);
    });

  function renderMeals() {
    const listEl = document.getElementById('mealsList');
    const emptyEl = document.getElementById('mealsEmpty');
    listEl.innerHTML = '';
    if (meals.length === 0) { emptyEl.classList.remove('hidden'); return; }
    emptyEl.classList.add('hidden');

    const byDay = {};
    meals.forEach(function (m) { (byDay[m.day] = byDay[m.day] || []).push(m); });

    Object.keys(byDay).sort().forEach(function (day) {
      const group = document.createElement('div');
      group.className = 'day-group';
      group.innerHTML = `<div class="day-label">${formatDayLabel(day)}</div>`;
      byDay[day].forEach(function (meal) { group.appendChild(buildMealCard(meal)); });
      listEl.appendChild(group);
    });

  function buildMealCard(meal) {
    const card = document.createElement('div');
    card.className = 'card meal-card';
    const mealIngredients = items.filter(function (i) { return i.type === 'meal-ingredient' && i.parentMealId === meal.id; });

    let bodyHtml = '';
    if (meal.locationType === 'home') {
      const cookNames = (meal.cooks || []).map(function (pid) { return attendeesById[pid] ? attendeesById[pid].name : null; }).filter(Boolean).join(', ');
      bodyHtml = `
        <div class="meal-slot">${meal.slot} · Home</div>
        <div class="meal-name">${escapeHtml(meal.name)}</div>
        ${cookNames ? `<div class="meal-meta">Cooking: ${escapeHtml(cookNames)}</div>` : ''}
        ${mealIngredients.length ? `<div class="ingredient-list">${mealIngredients.map(function (ing) {
          return `
          <div class="ingredient-row-display">
            <span>${escapeHtml(ing.name)} ${formatQty(ing)}</span>
            ${ing.needsPurchase ? '<span class="tag-chip">To buy</span>' : ''}
          </div>
        `; }).join('')}</div>` : ''}
      `;
    } else {
      bodyHtml = `
        <div class="meal-slot">${meal.slot} · Eating Out</div>
        <div class="meal-name">${escapeHtml(meal.name)}</div>
        ${meal.address ? `<div class="meal-meta">${escapeHtml(meal.address)} — <a class="directions-link" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(meal.address)}">Directions</a></div>` : ''}
        ${meal.notes ? `<div class="meal-meta" style="margin-top:4px;">${escapeHtml(meal.notes)}</div>` : ''}
      `;
    }

    card.innerHTML = `<div style="flex:1;">${bodyHtml}</div>`;
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-link';
    editBtn.textContent = 'Edit';
    editBtn.onclick = function () { window.openMealModal(meal.id); };
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-danger';
    delBtn.textContent = 'Delete';
    delBtn.onclick = function () { window.deleteMeal(meal.id); };
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    card.appendChild(actions);
    return card;
  }

  function formatQty(item) {
    if (item.quantity == null) return '';
    if (typeof item.quantity === 'number') return `(${item.quantity})`;
    const parts = Object.entries(item.quantity).map(function (entry) {
      const pid = entry[0], q = entry[1];
      return `${attendeesById[pid] ? attendeesById[pid].name : '?'}: ${q}`;
    });
    return `(${parts.join(', ')})`;
  }

  window.deleteMeal = async function (mealId) {
    if (!confirm('Delete this meal and its ingredients?')) return;
    const mealItems = items.filter(function (i) { return i.type === 'meal-ingredient' && i.parentMealId === mealId; });
    await Promise.all(mealItems.map(function (i) { return deleteDoc(doc(db, 'trips', tripId, 'items', i.id)); }));
    await deleteDoc(doc(db, 'trips', tripId, 'meals', mealId));

    await loadItems();

    editingMealId = mealId || null;
    document.getElementById('mealError').classList.add('hidden');
    document.getElementById('ingredientRowsContainer').innerHTML = '';

    if (editingMealId) {
      const meal = meals.find(function (m) { return m.id === editingMealId; });
      document.getElementById('mealModalTitle').textContent = 'Edit Meal';
      document.getElementById('mealSaveBtn').textContent = 'Update Meal';
      document.getElementById('mealDay').value = meal.day;
      document.getElementById('mealSlot').value = meal.slot;
      document.getElementById('locHome').checked = meal.locationType === 'home';
      document.getElementById('locOut').checked = meal.locationType === 'out';

        document.getElementById('mealEntreeName').value = meal.name || '';

      document.getElementById('mealRestaurantName').value = '';
      document.getElementById('mealAddress').value = '';
      document.getElementById('mealOutNotes').value = '';
      document.getElementById('locHome').checked = true;

  window.addIngredientRow = function (prefill) {
    const container = document.getElementById('ingredientRowsContainer');
    const row = document.createElement('div');
    row.className = 'ingredient-row';

    const name = (prefill && prefill.name) || '';
    const category = (prefill && prefill.category) || 'Food';
    const needsPurchase = (prefill && prefill.needsPurchase) || false;
    const taggedPeople = (prefill && prefill.taggedPeople) || [];
    let baseQty = 1;
    let qtyValues = {};
    if (prefill) {
      if (typeof prefill.quantity === 'number') {
        baseQty = prefill.quantity;
      } else if (prefill.quantity && typeof prefill.quantity === 'object') {
        qtyValues = prefill.quantity;
      }
    }

    row.innerHTML = `
      <div class="ingredient-row-top">
        <input type="text" class="ing-name" placeholder="Ingredient name" style="flex:2;" value="${escapeHtml(name)}">
        <select class="ing-category" style="flex:1;">
          ${CATEGORIES.map(function (c) { return `<option value="${c}"${c === category ? ' selected' : ''}>${c}</option>`; }).join('')}

        <label>Quantity</label>

      <div class="ing-people-picker">${buildPeoplePickerHtml('ing', taggedPeople, qtyValues)}</div>

  window.saveMeal = async function () {
    const errEl = document.getElementById('mealError');
    errEl.classList.add('hidden');
    const day = document.getElementById('mealDay').value;
    const slot = document.getElementById('mealSlot').value;
    const isHome = document.getElementById('locHome').checked;

    let mealData;
    if (isHome) {
      const name = document.getElementById('mealEntreeName').value.trim();
      if (!name) { errEl.textContent = 'Please enter an entree name.'; errEl.classList.remove('hidden'); return; }
      const cooks = Array.from(document.querySelectorAll('.meal-cook-cb:checked')).map(function (cb) { return cb.value; });
      mealData = { day: day, slot: slot, locationType: 'home', name: name, cooks: cooks, notes: '' };
    } else {
      const name = document.getElementById('mealRestaurantName').value.trim();
      if (!name) { errEl.textContent = 'Please enter a restaurant name.'; errEl.classList.remove('hidden'); return; }
      const address = document.getElementById('mealAddress').value.trim();
      const notes = document.getElementById('mealOutNotes').value.trim();
      mealData = { day: day, slot: slot, locationType: 'out', name: name, address: address, notes: notes };
    }

    // Validate ingredient rows before writing anything
    if (isHome) {
      const rows = document.querySelectorAll('#ingredientRowsContainer .ingredient-row');
      for (const row of rows) {
        const name = row.querySelector('.ing-name').value.trim();
        if (!name) continue;
        const needsPurchase = row.querySelector('.ing-needs-purchase').checked;
        const taggedCount = row.querySelectorAll('.ing-person-cb:checked').length;
        if (needsPurchase && taggedCount === 0) {
          errEl.textContent = `Tag at least one person for "${name}" so it shows up on someone's shopping list.`;
          errEl.classList.remove('hidden');
          return;
        }
      }
    }

    let mealId;
    if (editingMealId) {
      await updateDoc(doc(db, 'trips', tripId, 'meals', editingMealId), mealData);
      mealId = editingMealId;
      const oldItems = items.filter(function (i) { return i.type === 'meal-ingredient' && i.parentMealId === mealId; });
      await Promise.all(oldItems.map(function (i) { return deleteDoc(doc(db, 'trips', tripId, 'items', i.id)); }));
    } else {
      mealData.createdAt = serverTimestamp();
      const mealRef = await addDoc(collection(db, 'trips', tripId, 'meals'), mealData);
      mealId = mealRef.id;
    }

    if (isHome) {
      const rows = document.querySelectorAll('#ingredientRowsContainer .ingredient-row');
      for (const row of rows) {
        const name = row.querySelector('.ing-name').value.trim();
        if (!name) continue;
        const category = row.querySelector('.ing-category').value;
        const needsPurchase = row.querySelector('.ing-needs-purchase').checked;
        const baseQtyEl = row.querySelector('.ing-base-qty');
        const result = readQtyAndTags(row, 'ing', baseQtyEl);

        await addDoc(collection(db, 'trips', tripId, 'items'), {
          type: 'meal-ingredient', name: name, category: category, quantity: result.quantity, taggedPeople: result.taggedPeople,
          needsPurchase: needsPurchase, purchased: false, packed: false, parentMealId: mealId, notes: '',
          createdAt: serverTimestamp()
        });
      }
    }

    window.closeMealModal();
    await loadMeals();
    await loadItems();
    renderAll();
  };

  window.saveSupply = async function () {
    const errEl = document.getElementById('supplyError');
    errEl.classList.add('hidden');
    const name = document.getElementById('supplyName').value.trim();
    if (!name) { errEl.textContent = 'Please enter an item name.'; errEl.classList.remove('hidden'); return; }
    const category = document.getElementById('supplyCategory').value;
    const needsPurchase = document.getElementById('supplyNeedsPurchase').checked;
    const notes = document.getElementById('supplyNotes').value.trim();

    const baseQtyEl = document.getElementById('supplyBaseQty');
    const result = readQtyAndTags(document, 'supply', baseQtyEl);

    if (needsPurchase && result.taggedPeople.length === 0) {
      errEl.textContent = "Tag at least one person so this shows up on someone's shopping list.";
      errEl.classList.remove('hidden');
      return;
    }

    const supplyData = {
      type: 'supply', name: name, category: category, quantity: result.quantity, taggedPeople: result.taggedPeople,
      needsPurchase: needsPurchase, purchased: false, packed: false, parentMealId: null, notes: notes
    };

    if (editingSupplyId) {
      await updateDoc(doc(db, 'trips', tripId, 'items', editingSupplyId), supplyData);
    } else {
      supplyData.createdAt = serverTimestamp();
      await addDoc(collection(db, 'trips', tripId, 'items'), supplyData);
    }

    window.closeSupplyModal();
    await loadItems();
    renderAll();
  };

  // ---------- Shopping List ----------
  function renderShoppingList() {
    const listEl = document.getElementById('shoppingList');
    const emptyEl = document.getElementById('shoppingEmpty');
    const myItems = items.filter(function (i) {
      return i.needsPurchase && (i.taggedPeople || []).includes(currentPerson.id);
    });
    listEl.innerHTML = '';
    if (myItems.length === 0) { emptyEl.classList.remove('hidden'); return; }
    emptyEl.classList.add('hidden');

    const byCategory = {};
    myItems.forEach(function (i) { (byCategory[i.category || 'Other'] = byCategory[i.category || 'Other'] || []).push(i); });

    CATEGORIES.forEach(function (cat) {
      if (!byCategory[cat]) return;
      const header = document.createElement('div');
      header.className = 'category-label';
      header.textContent = cat;
      header.style.marginTop = '10px';
      listEl.appendChild(header);
      byCategory[cat].forEach(function (item) {
        const myQty = typeof item.quantity === 'number' ? item.quantity : (item.quantity && item.quantity[currentPerson.id] != null ? item.quantity[currentPerson.id] : '');
        const row = document.createElement('div');
        row.className = 'shop-item' + (item.purchased ? ' purchased' : '');
        row.innerHTML = `
          <input type="checkbox" ${item.purchased ? 'checked' : ''}>
          <span class="shop-item-name">${escapeHtml(item.name)}</span>
          <span class="shop-item-qty">${myQty !== '' ? 'Qty: ' + myQty : ''}</span>
        `;
        row.querySelector('input').onchange = function (e) { window.togglePurchased(item.id, e.target.checked); };
        listEl.appendChild(row);
      });
    });
  }

  window.togglePurchased = async function (itemId, purchased) {
    await updateDoc(doc(db, 'trips', tripId, 'items', itemId), { purchased: purchased });
    await loadItems();
    renderShoppingList();
    renderMeals();
    renderSupplies();
  };

  // ---------- Packing List ----------
  function renderPackingTabs() {
    const el = document.getElementById('packingPersonTabs');
    if (!activePackingTarget) {
      activePackingTarget = { type: 'household', id: currentHousehold ? currentHousehold.id : 'none' };
    }
    const pills = [];
    pills.push({ type: 'household', id: currentHousehold ? currentHousehold.id : 'none', label: 'Family' });
    myHouseholdAttendees.forEach(p => pills.push({ type: 'person', id: p.id, label: p.name }));

    el.innerHTML = pills.map(pill => {
      const isActive = pill.type === activePackingTarget.type && pill.id === activePackingTarget.id;
      return `<button type="button" class="person-pill${isActive ? ' active' : ''}" onclick="window.setPackingTarget('${pill.type}','${pill.id}')">${escapeHtml(pill.label)}</button>`;
    }).join('');

    const activeLabel = pills.find(p => p.type === activePackingTarget.type && p.id === activePackingTarget.id);
    document.getElementById('packingListTitle').textContent = activeLabel ? `${activeLabel.label}'s Packing List` : 'Packing List';
    if (activeLabel && activeLabel.type === 'household') {
      document.getElementById('packingListTitle').textContent = 'Family Packing List';
    }
  }

  window.setPackingTarget = function (type, id) {
    activePackingTarget = { type, id };
    renderPackingTabs();
    renderPackingList();
  };

  function getPackingItemsFor(target) {
    if (!target) return [];
    if (target.type === 'household') {
      const auto = items.filter(i => i.type === 'meal-ingredient' || i.type === 'supply');
      const standalone = items.filter(i => i.type === 'packing' && i.packingForType === 'household' && i.packingForId === target.id);
      return [...auto, ...standalone];
    } else {
      const auto = items.filter(i => (i.type === 'meal-ingredient' || i.type === 'supply') && (i.taggedPeople || []).includes(target.id));
      const standalone = items.filter(i => i.type === 'packing' && i.packingForType === 'person' && i.packingForId === target.id);
      return [...auto, ...standalone];
    }
  }

  function renderPackingList() {
    if (!activePackingTarget) return;
    const listEl = document.getElementById('packingList');
    const emptyEl = document.getElementById('packingEmpty');
    const packItems = getPackingItemsFor(activePackingTarget);
    listEl.innerHTML = '';
    if (packItems.length === 0) { emptyEl.classList.remove('hidden'); return; }
    emptyEl.classList.add('hidden');

    const byCategory = {};
    packItems.forEach(i => { (byCategory[i.category || 'Other'] = byCategory[i.category || 'Other'] || []).push(i); });

    CATEGORIES.forEach(cat => {
      if (!byCategory[cat]) return;
      const header = document.createElement('div');
      header.className = 'category-label';
      header.textContent = cat;
      header.style.marginTop = '10px';
      listEl.appendChild(header);
      byCategory[cat].forEach(item => {
        const isPerson = activePackingTarget.type === 'person';
        const displayQty = isPerson && typeof item.quantity === 'object' && item.quantity[activePackingTarget.id] != null
          ? item.quantity[activePackingTarget.id]
          : (typeof item.quantity === 'number' ? item.quantity : '');
        const sourceTag = item.type === 'meal-ingredient' ? 'from meal' : (item.type === 'supply' ? 'supply' : '');
        const row = document.createElement('div');
        row.className = 'shop-item pack-item' + (item.packed ? ' packed' : '');
        row.innerHTML = `
          <input type="checkbox" ${item.packed ? 'checked' : ''}>
          <span class="shop-item-name">${escapeHtml(item.name)}${sourceTag ? `<span class="auto-tag">(${sourceTag})</span>` : ''}</span>
          <span class="shop-item-qty">${displayQty !== '' ? 'Qty: ' + displayQty : ''}</span>
        `;
        row.querySelector('input').onchange = (e) => window.togglePacked(item.id, e.target.checked);
        if (item.type === 'packing') {
          const editBtn = document.createElement('button');
          editBtn.className = 'btn-link';
          editBtn.textContent = 'Edit';
          editBtn.onclick = () => window.openPackingModal(item.id);
          row.appendChild(editBtn);
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-danger';
          delBtn.textContent = 'Delete';
          delBtn.onclick = () => window.deletePacking(item.id);
          row.appendChild(delBtn);
        }
        listEl.appendChild(row);
      });
    });
  }

  window.togglePacked = async function (itemId, packed) {
    await updateDoc(doc(db, 'trips', tripId, 'items', itemId), { packed: packed });
    await loadItems();
    renderPackingList();
  };

  window.deletePacking = async function (itemId) {
    if (!confirm('Delete this packing item?')) return;
    await deleteDoc(doc(db, 'trips', tripId, 'items', itemId));
    await loadItems();
    renderPackingList();
  };

  function populatePackingAssignOptions(selectedType, selectedId) {
    const sel = document.getElementById('packingAssignTo');
    const options = [];
    options.push({ type: 'household', id: currentHousehold ? currentHousehold.id : 'none', label: 'Family (General)' });
    myHouseholdAttendees.forEach(p => options.push({ type: 'person', id: p.id, label: p.name }));
    sel.innerHTML = options.map(o =>
      `<option value="${o.type}|${o.id}"${o.type === selectedType && o.id === selectedId ? ' selected' : ''}>${escapeHtml(o.label)}</option>`
    ).join('');
  }

  window.openPackingModal = function (itemId) {
    editingPackingId = itemId || null;
    document.getElementById('packingError').classList.add('hidden');

    if (editingPackingId) {
      const item = items.find(i => i.id === editingPackingId);
      document.getElementById('packingModalTitle').textContent = 'Edit Packing Item';
      document.getElementById('packingSaveBtn').textContent = 'Update Item';
      document.getElementById('packingName').value = item.name || '';
      document.getElementById('packingCategory').value = item.category || 'Other';
      document.getElementById('packingQty').value = typeof item.quantity === 'number' ? item.quantity : 1;
      document.getElementById('packingNotes').value = item.notes || '';
      populatePackingAssignOptions(item.packingForType, item.packingForId);
    } else {
      document.getElementById('packingModalTitle').textContent = 'Add Packing Item';
      document.getElementById('packingSaveBtn').textContent = 'Save Item';
      document.getElementById('packingName').value = '';
      document.getElementById('packingCategory').value = 'Other';
      document.getElementById('packingQty').value = 1;
      document.getElementById('packingNotes').value = '';
      const defaultType = activePackingTarget ? activePackingTarget.type : 'household';
      const defaultId = activePackingTarget ? activePackingTarget.id : (currentHousehold ? currentHousehold.id : 'none');
      populatePackingAssignOptions(defaultType, defaultId);
    }

    document.getElementById('packingModalOverlay').classList.add('open');
  };
  window.closePackingModal = function () {
    document.getElementById('packingModalOverlay').classList.remove('open');
    editingPackingId = null;
  };

  window.savePacking = async function () {
    const errEl = document.getElementById('packingError');
    errEl.classList.add('hidden');
    const name = document.getElementById('packingName').value.trim();
    if (!name) { errEl.textContent = 'Please enter an item name.'; errEl.classList.remove('hidden'); return; }
    const category = document.getElementById('packingCategory').value;
    const quantity = parseFloat(document.getElementById('packingQty').value) || 1;
    const notes = document.getElementById('packingNotes').value.trim();
    const [packingForType, packingForId] = document.getElementById('packingAssignTo').value.split('|');

    const packingData = {
      type: 'packing', name, category, quantity, notes,
      packingForType, packingForId, packed: false,
      taggedPeople: [], needsPurchase: false, purchased: false, parentMealId: null
    };

    if (editingPackingId) {
      await updateDoc(doc(db, 'trips', tripId, 'items', editingPackingId), packingData);
    } else {
      packingData.createdAt = serverTimestamp();
      await addDoc(collection(db, 'trips', tripId, 'items'), packingData);
    }

    window.closePackingModal();
    await loadItems();
    renderPackingList();
  };

  // ---------- Edit Trip ----------
  window.openEditTripModal = function () {
    document.getElementById('editTripError').classList.add('hidden');
    document.getElementById('editTripName').value = trip.name || '';
    document.getElementById('editTripDestination').value = trip.destination || '';
    document.getElementById('editTripStart').value = trip.startDate || '';
    document.getElementById('editTripEnd').value = trip.endDate || '';
    document.getElementById('editTripLodging').value = trip.lodgingLink || '';
    document.getElementById('editTripNotes').value = trip.notes || '';

    selectedEditTheme = trip.theme || 'default';
    renderEditThemeSwatches();

    editAttendeeIds = [...trip.attendees];
    editPendingGuests = [];
    renderEditAttendeeChips();
    renderEditHouseholdPicker();
    renderEditGuestChips();

    document.getElementById('editTripModalOverlay').classList.add('open');
  };
  window.closeEditTripModal = function () {
    document.getElementById('editTripModalOverlay').classList.remove('open');
  };

  function renderEditThemeSwatches() {
    const el = document.getElementById('editThemeSwatches');
    el.innerHTML = '';
    Object.entries(TRIP_THEMES).forEach(([key, theme]) => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (key === selectedEditTheme ? ' selected' : '');
      sw.innerHTML = `<div class="swatch-color" style="background:linear-gradient(135deg, ${theme.primary}, ${theme.secondary});"></div>${theme.label}`;
      sw.onclick = () => { selectedEditTheme = key; renderEditThemeSwatches(); };
      el.appendChild(sw);
    });
  }

  function lookupPersonName(pid) {
    return attendeesById[pid]?.name || householdRoster.find(p => p.id === pid)?.name || 'Unknown';
  }

  function renderEditAttendeeChips() {
    document.getElementById('editAttendeeChips').innerHTML = editAttendeeIds.map(pid => {
      const isOwner = pid === trip.ownerId;
      return `<span class="guest-chip">${escapeHtml(lookupPersonName(pid))}${isOwner ? ' <em style="color:var(--muted);">(owner)</em>' : ` <button type="button" onclick="window.removeEditAttendee('${pid}')">✕</button>`}</span>`;
    }).join('');
  }

  function renderEditHouseholdPicker() {
    const notAttending = householdRoster.filter(p => !editAttendeeIds.includes(p.id));
    const el = document.getElementById('editHouseholdPicker');
    if (notAttending.length === 0) {
      el.innerHTML = '<div style="font-size:13px; color:var(--muted);">Everyone in your household is already on this trip.</div>';
      return;
    }
    el.innerHTML = notAttending.map(p => `
      <div class="checkbox-row">
        <input type="checkbox" onchange="window.addEditHouseholdMember('${p.id}')">
        <label style="text-transform:none; font-size:15px; color:var(--text); margin:0;">${escapeHtml(p.name)}</label>
      </div>
    `).join('');
  }

  window.addEditHouseholdMember = function (personId) {
    if (!editAttendeeIds.includes(personId)) editAttendeeIds.push(personId);
    renderEditAttendeeChips();
    renderEditHouseholdPicker();
  };

  window.removeEditAttendee = function (personId) {
    if (personId === trip.ownerId) return;
    editAttendeeIds = editAttendeeIds.filter(id => id !== personId);
    renderEditAttendeeChips();
    renderEditHouseholdPicker();
  };

  window.addEditGuest = function () {
    const name = document.getElementById('editGuestName').value.trim();
    const email = document.getElementById('editGuestEmail').value.trim();
    if (!name || !email) return;
    editPendingGuests.push({ name, email });
    document.getElementById('editGuestName').value = '';
    document.getElementById('editGuestEmail').value = '';
    renderEditGuestChips();
  };

  window.removeEditGuest = function (i) {
    editPendingGuests.splice(i, 1);
    renderEditGuestChips();
  };

  function renderEditGuestChips() {
    document.getElementById('editGuestChips').innerHTML = editPendingGuests.map((g, i) =>
      `<span class="guest-chip">${escapeHtml(g.name)} <button type="button" onclick="window.removeEditGuest(${i})">✕</button></span>`
    ).join('');
  }

  async function sendTripInviteFromEdit(person, tripName) {
    const token = crypto.randomUUID();
    await setDoc(doc(db, 'invites', token), {
      type: 'trip', targetId: tripId, personId: person.id,
      name: person.name, email: person.email,
      invitedBy: currentPerson.name,
      used: false, createdAt: serverTimestamp()
    });
    const link = `${window.location.origin}${window.location.pathname.replace('trip.html', '')}setup.html?invite=${token}`;
    try {
      await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'send-invite',
          to: person.email,
          inviteeName: person.name,
          inviterName: currentPerson.name,
          context: `the trip "${tripName}"`,
          link
        })
      });
    } catch (e) {
      console.error('Invite email failed to send:', e);
    }
  }

  window.saveEditTrip = async function () {
    const errEl = document.getElementById('editTripError');
    errEl.classList.add('hidden');
    const name = document.getElementById('editTripName').value.trim();
    const destination = document.getElementById('editTripDestination').value.trim();
    const startDate = document.getElementById('editTripStart').value;
    const endDate = document.getElementById('editTripEnd').value;
    const lodgingLink = document.getElementById('editTripLodging').value.trim();
    const notes = document.getElementById('editTripNotes').value.trim();

    if (!name || !startDate || !endDate) {
      errEl.textContent = 'Trip name, start date, and end date are required.';
      errEl.classList.remove('hidden');
      return;
    }
    if (endDate < startDate) {
      errEl.textContent = 'End date must be on or after the start date.';
      errEl.classList.remove('hidden');
      return;
    }

    // Create person docs for any newly-invited guests
    const newGuestRecords = [];
    for (const guest of editPendingGuests) {
      const guestRef = await addDoc(collection(db, 'people'), {
        name: guest.name, email: guest.email, authUid: null,
        householdId: null, isProfileOnly: false,
        createdAt: serverTimestamp()
      });
      editAttendeeIds.push(guestRef.id);
      newGuestRecords.push({ id: guestRef.id, ...guest });
    }

    const attendeeUids = editAttendeeIds
      .map(pid => attendeesById[pid]?.authUid || householdRoster.find(p => p.id === pid)?.authUid || null)
      .filter(Boolean);

    await updateDoc(doc(db, 'trips', tripId), {
      name, destination, startDate, endDate, theme: selectedEditTheme,
      lodgingLink, notes,
      attendees: editAttendeeIds,
      attendeeUids
    });

    for (const guest of newGuestRecords) {
      await sendTripInviteFromEdit(guest, name);
    }

    window.closeEditTripModal();
    window.location.reload();
  };
</script>
</body>
</html>
